    <title>Foto- en videopresentatie</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        /* Startscherm vult het volledige venster */
        #startscherm {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #18251b;
        }

        /* Startknop met afbeelding en tekst */
        #startKnop {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            background: #29452f;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            transition: transform 0.2s, background 0.2s;
        }

        #startKnop:hover {
            background: #3b6343;
            transform: scale(1.04);
        }

        #startKnop img {
            display: block;
            width: min(320px, 65vw);
            height: min(220px, 40vh);
            object-fit: contain;
            border-radius: 12px;
        }

        /* Presentatie vult het volledige venster */
        #presentatie {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: black;
        }

        #foto, #video {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

// Ga naar het volgende bestand
function gaNaarVolgendBestand() {
    clearTimeout(timer);

    // Stop een eventuele video
    video.pause();

    // Ruim de huidige video op en ga verder
    toonVolgendBestand();
}





        // Toon het volgende bestand
        function toonVolgendBestand() {
            clearTimeout(timer);

            // Opnieuw beginnen na het laatste bestand
            if (index >= images.length) {
                index = 0;
            }

            const bestand = images[index];
            index++;

            if (/\.mp4$/i.test(bestand)) {
                // Video afspelen
                foto.style.display = "none";
                video.style.display = "block";

                video.onended = function () {
                    toonVolgendBestand();
                };

                video.onerror = function () {
                    console.error("Video kan niet worden geladen:", bestand);
                    toonVolgendBestand();
                };

                video.src = bestand;
                video.currentTime = 0;
                video.load();

                // Probeer de video met geluid af te spelen
                video.muted = false;

                video.play().catch(function (error) {
                    console.error("Video afspelen mislukt:", error);
                });

            } else {
                // Foto tonen
                video.pause();
                video.onended = null;
                video.onerror = null;
                video.removeAttribute("src");
                video.load();
                video.style.display = "none";

                foto.style.display = "block";

                foto.onload = function () {
                    timer = setTimeout(
                        toonVolgendBestand,
                        fotoInterval
                    );
                };

                foto.onerror = function () {
                    console.error("Foto kan niet worden geladen:", bestand);
                    toonVolgendBestand();
                };

                foto.src = bestand;
            }
        }
